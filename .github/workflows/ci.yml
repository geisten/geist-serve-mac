name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runtime_ref:
        description: Optional full runtime commit SHA; defaults to geist-serve.ref
        required: false
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  shell:
    timeout-minutes: 20
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: compile native shell
        run: swift build -c release
  integration:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: require an immutable runtime revision
        id: runtime
        env:
          RUNTIME_REF: ${{ inputs.runtime_ref }}
        shell: bash
        run: |
          revision=${RUNTIME_REF:-$(cat geist-serve.ref)}
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: geisten/geist-serve
          ref: ${{ steps.runtime.outputs.revision }}
          path: runtime
      - name: Build pinned runtime before restoring model cache
        run: |
          brew install libomp
          make -C runtime geistd GEIST_STATIC_OMP=1
      - name: cache reference model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/geistlib/gguf_artifacts/smollm2-360m-instruct-q8_0.gguf
          key: geist-model-smollm2-360m-q8-48ab3034d0dd
      - name: build and test the app pair
        run: |
          make -C runtime fetch-model
          export GEIST_TEST_MODEL="$PWD/runtime/geistlib/gguf_artifacts/smollm2-360m-instruct-q8_0.gguf"
          export GEIST_DESKTOP_EVIDENCE="$PWD/build/desktop-evidence"
          make test RUNTIME_DIR=runtime VERSION=0.5.30
          make test-dmg RUNTIME_DIR=runtime VERSION=0.5.30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-review-dmg
          path: |
            build/Geist-*-arm64.dmg
            build/desktop-evidence/*.png
